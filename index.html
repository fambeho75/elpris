<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="description" content="SE3 electricity prices per quarter-hour, cheapest times and your monthly cost.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Elpris">
  <title>Elpris</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("elpris-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest?v=2">
  <link rel="icon" href="favicon-32.png?v=2" sizes="32x32" type="image/png">
  <link rel="icon" href="icon-rounded.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <noscript><p class="noscript">Elpris needs JavaScript to load prices.</p></noscript>
  <div id="app"></div>
  <script src="tariff.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
